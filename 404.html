<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="/favicon.png">
<title>404 — Evan Lison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0A0F24;
  --line:#FFCF1F;
  --idle:#373C50;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--night);
  color:#fff;
  font-family:var(--display);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
::selection{background:var(--line);color:var(--night);}
a:focus-visible{outline:3px solid var(--line);outline-offset:4px;}

.bg{position:fixed;inset:0;pointer-events:none;}
.bg::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(560px circle at 50% 42%,rgba(255,207,31,.10),transparent 65%),
    radial-gradient(900px circle at 85% 110%,rgba(108,123,255,.2),transparent 60%);
}
.net{position:absolute;inset:0;width:100%;height:100%;opacity:.45;
  -webkit-mask-image:radial-gradient(ellipse at 50% 50%,transparent 26%,#000 62%);
  mask-image:radial-gradient(ellipse at 50% 50%,transparent 26%,#000 62%);}
.net path{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;}
.net .st{fill:var(--night);stroke:#fff;stroke-width:4;}

main{
  position:relative;
  min-height:100vh;min-height:100svh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:40px 20px;text-align:center;
}
h1{
  margin:0;
  font-stretch:125%;font-weight:800;
  font-size:clamp(110px,24vw,280px);line-height:.85;letter-spacing:-.04em;
  animation:in 1.4s var(--ease) both;
}
@keyframes in{from{font-stretch:62%;opacity:0;transform:translateY(.12em);}to{font-stretch:125%;opacity:1;transform:none;}}

/* la ligne interrompue */
.track{position:relative;width:min(520px,82vw);height:24px;margin:clamp(28px,4vw,44px) 0 clamp(24px,3vw,34px);}
.track .done,.track .cut{position:absolute;top:50%;height:6px;margin-top:-3px;border-radius:3px;}
.track .done{left:0;width:50%;background:var(--line);transform-origin:left;animation:grow 1.1s .3s var(--ease) both;}
.track .cut{left:50%;right:0;background:repeating-linear-gradient(90deg,var(--idle) 0 14px,transparent 14px 26px);
  -webkit-mask-image:linear-gradient(90deg,#000 40%,transparent);mask-image:linear-gradient(90deg,#000 40%,transparent);}
.track .s{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--line);}
.track .s.a{left:0;}
.track .s.b{left:25%;}
.track .here{
  position:absolute;top:50%;left:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;
  background:#fff;box-shadow:0 0 0 3px var(--night),0 0 0 6px var(--line);
  animation:pop .5s 1.25s var(--ease) both;
}
.track .here::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--line);animation:pulse 2s 1.8s ease-out infinite;}
@keyframes grow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@keyframes pop{from{transform:scale(0);}to{transform:scale(1);}}
@keyframes pulse{from{transform:scale(1);opacity:.7;}to{transform:scale(2.2);opacity:0;}}

.msg{margin:0;font-size:clamp(18px,2vw,24px);font-weight:500;color:rgba(255,255,255,.82);animation:fade .8s .6s both;}
.back{
  display:inline-flex;align-items:center;gap:8px;margin-top:clamp(22px,3vw,30px);
  padding:12px 22px;border-radius:999px;
  background:var(--line);color:var(--night);
  font-weight:700;font-size:16px;text-decoration:none;
  transition:transform .25s var(--ease),box-shadow .25s;
  animation:fade .8s .8s both;
}
.back:hover{transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(255,207,31,.6);}
@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <svg class="net" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
    <path stroke="#6C7BFF" stroke-opacity=".8" d="M-40 160H260L420 320V960"/>
    <path stroke="#FF6B4A" stroke-opacity=".75" d="M-40 700H180L330 550H520"/>
    <path stroke="#34D3A6" stroke-opacity=".7" d="M1480 230H1180L1020 70V-40"/>
    <path stroke="#FFCF1F" stroke-opacity=".8" d="M1480 640H1260L1120 780V960"/>
    <circle class="st" cx="260" cy="160" r="11"/>
    <circle class="st" cx="420" cy="320" r="11"/>
    <circle class="st" cx="180" cy="700" r="11"/>
    <circle class="st" cx="1180" cy="230" r="11"/>
    <circle class="st" cx="1260" cy="640" r="11"/>
  </svg>
</div>

<main>
  <h1>404</h1>
  <div class="track" aria-hidden="true">
    <span class="done"></span>
    <span class="cut"></span>
    <span class="s a"></span>
    <span class="s b"></span>
    <span class="here"></span>
  </div>
  <p class="msg">Oups, cette page n'existe pas !</p>
  <a class="back" href="/">↻ Retour au portfolio</a>
</main>
</body>
</html>
