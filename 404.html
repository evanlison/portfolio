<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="icon" type="image/png" href="/favicon.png">
  <title>404 — Evan Lison</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter+Tight:wght@400..600&family=Inter:wght@400..600&display=swap" rel="stylesheet">
  <style>
:root{
  --bg:#F5F5F2;
  --ink:#121212;
  --ink-2:#67676A;
  --hair:#E3E3DD;
  --accent:#E35B2E;
  --maxw:1320px;
  --pad:clamp(18px,4vw,56px);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --display:"Inter Tight","Inter",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;display:flex;flex-direction:column;min-height:100vh;min-height:100svh;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
p{margin:0;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
.mono{font-family:var(--mono);font-size:12px;line-height:1.5;letter-spacing:.02em;text-transform:uppercase;}
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad);}

.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:58px;}
.brand{font:600 15px/1 var(--display);letter-spacing:-.01em;}
.clock{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;}
.clock i{display:inline-block;width:6px;height:6px;margin-right:7px;border-radius:50%;background:var(--accent);vertical-align:1px;animation:blink 2s steps(1) infinite;}
@keyframes blink{50%{opacity:.25;}}

main{flex:1;display:flex;align-items:center;}
.err{padding-block:clamp(40px,8vh,90px);}
h1{margin:0;font:500 clamp(84px,14vw,170px)/.86 var(--display);letter-spacing:-.055em;}
h1 .ln{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .12em .06em;margin:0 -.12em -.06em;}
h1 .ln > span{display:inline-block;}
h1 .o{color:var(--accent);}
.js h1 .ln > span{transform:translateY(105%);animation:up 1.1s var(--ease) forwards;}
@keyframes up{to{transform:none;}}
.below{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 32px;margin-top:clamp(26px,4vh,40px);padding-top:22px;border-top:1px solid var(--hair);}
.msg{font:500 clamp(19px,1.7vw,23px)/1.35 var(--display);letter-spacing:-.015em;}
.back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px solid var(--accent);border-radius:999px;color:var(--accent);font-size:14.5px;font-weight:500;transition:background .2s,color .2s;}
.back:hover{background:var(--accent);color:#fff;}
.js .below{opacity:0;transform:translateY(12px);animation:fade .8s .35s var(--ease) forwards;}
@keyframes fade{to{opacity:1;transform:none;}}

.foot{padding:22px 0 30px;color:var(--ink-2);border-top:1px solid var(--hair);}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;}.js h1 .ln > span,.js .below{transform:none;opacity:1;}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="wrap">
      <a class="brand" href="/">Evan LISON</a>
      <p class="clock mono" aria-label="Heure à Paris"><i></i><span>--:--:--</span></p>
    </div>
  </header>

  <main>
    <div class="wrap err">
      <h1 aria-label="404"><span class="ln"><span>4<span class="o">0</span>4</span></span></h1>
      <div class="below">
        <p class="msg">Oups, cette page n'existe pas !</p>
        <a class="back" href="/">↻ Retour au portfolio</a>
      </div>
    </div>
  </main>

  <footer class="wrap">
    <p class="foot mono">Evan LISON (2026-2027)</p>
  </footer>

<script>
(() => {
  const el = document.querySelector('.clock span');
  const fmt = new Intl.DateTimeFormat('fr-FR', { timeZone: 'Europe/Paris', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  const tick = () => { el.textContent = fmt.format(new Date()); };
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
