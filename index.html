<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evan Lison — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EF;
    --ink:#141210;
    --orange:#F04525;
    --muted:#77726A;
    --hairline:#D8D2C6;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} }
  body{
    margin:0;
    background:#141210;
    font-family:'Bricolage Grotesque', sans-serif;
    color:var(--ink);
  }
  a{color:inherit;}
  ::selection{ background:var(--orange); color:#fff; }
  :focus-visible{ outline:2.5px solid var(--orange); outline-offset:3px; }

  .sheet{
    max-width:980px;
    margin:40px auto;
    background:var(--paper);
    border:1.5px solid var(--ink);
    padding:56px 64px 40px;
    box-shadow:0 30px 70px rgba(0,0,0,0.45);
  }
  @media (max-width:720px){
    .sheet{ margin:0; border:none; padding:36px 22px 28px; box-shadow:none; }
  }

  .head-row{
    display:flex; justify-content:space-between; gap:40px; flex-wrap:wrap;
  }
  .id-block h1{
    margin:0;
    font-size:clamp(36px, 5vw, 52px);
    font-weight:800;
    letter-spacing:-0.01em;
    line-height:1;
  }
  .id-block h1 .surname{ font-weight:800; }
  .id-block .role{
    font-size:20px;
    font-weight:500;
    margin-top:8px;
  }
  .id-block .place{
    font-size:14px;
    color:var(--muted);
    margin-top:4px;
    font-weight:400;
  }
  .intro-block{
    max-width:400px;
    text-align:right;
  }
  .resume-link{
    display:inline-block;
    font-size:13px;
    color:var(--muted);
    text-decoration:underline;
    margin-bottom:10px;
  }
  .intro{
    text-align:right;
    font-size:14.5px;
    line-height:1.6;
    color:var(--ink);
    margin:0;
  }

  .contact-row{
    display:flex; flex-wrap:wrap; gap:12px;
    margin-top:30px;
  }
  .pill{
    display:inline-flex; align-items:center;
    border:1.5px solid var(--orange);
    color:var(--orange);
    border-radius:999px;
    padding:9px 20px;
    font-size:13.5px;
    font-weight:500;
    text-decoration:none;
    background:var(--paper);
    transition:background 0.15s ease, color 0.15s ease;
  }
  .pill:hover{ background:var(--orange); color:var(--paper); }
  .pill-linkedin:hover{ background:#0A66C2; color:#fff; border-color:#0A66C2; }

  hr{
    border:none; border-top:1px solid var(--hairline);
    margin:38px 0;
  }

  .sec-title{
    color:var(--orange);
    font-weight:800;
    font-size:28px;
    margin:0 0 20px;
    letter-spacing:-0.01em;
  }
  .sub-label{
    color:var(--orange);
    font-weight:700;
    font-size:13px;
    text-transform:none;
    margin-bottom:4px;
  }

  .comp-grid{
    display:grid;
    grid-template-columns: 1.5fr 1fr;
    gap:36px;
  }
  .comp-grid p{
    text-align:justify;
    font-size:16.5px;
    line-height:1.5;
    margin:0;
  }
  .comp-side div{ margin-bottom:18px; }
  .comp-side div:last-child{ margin-bottom:0; }
  .comp-side p{ margin:0; font-size:14px; line-height:1.5; color:var(--ink); }
  @media (max-width:640px){ .comp-grid{grid-template-columns:1fr;} }

  .grid-3{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:30px 28px;
  }
  @media (max-width:760px){ .grid-3{grid-template-columns:1fr 1fr;} }
  @media (max-width:520px){ .grid-3{grid-template-columns:1fr;} }

  .card h3{
    font-size:16.5px;
    font-weight:700;
    margin:0 0 3px;
    line-height:1.25;
  }
  .card .when{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .card .subtitle{
    font-size:13.5px;
    font-weight:600;
    margin-bottom:6px;
  }
  .card p.desc{
    font-size:13px;
    line-height:1.55;
    color:var(--ink);
    margin:0;
  }
  .card p.desc.todo{ color:var(--muted); font-style:italic; }
  .card .subtitle.todo{ color:var(--muted); font-style:italic; font-weight:500; }

  .project-block
